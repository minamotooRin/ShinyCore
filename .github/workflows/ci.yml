name: engine
on: [push, pull_request]
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            graphics: 'OFF'
            network: 'OFF'
          - os: ubuntu-latest
            graphics: 'OFF'
            network: 'ON'
          - os: windows-latest
            graphics: 'ON'
            network: 'ON'
          - os: macos-latest
            graphics: 'ON'
            network: 'ON'
          - os: ubuntu-latest
            graphics: 'ON'
            network: 'OFF'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - if: runner.os == 'Linux' && matrix.graphics == 'ON'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev xvfb
      - run: cmake -S . -B build -DSHINY_GRAPHICS=${{ matrix.graphics }} -DSHINY_NETWORK=${{ matrix.network }} -DSHINY_STREAMING=${{ matrix.network }} -DSHINY_ADVANCED_RENDER=${{ matrix.network }} -DSHINY_DEVTOOLS=${{ matrix.network }} -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure
      - if: runner.os == 'Linux' && matrix.graphics == 'ON'
        run: xvfb-run -a ./build/shiny examples/workshop --mute --frames 90 --capture workshop.png
      - if: runner.os == 'Linux' && matrix.graphics == 'ON'
        run: xvfb-run -a python tests/settings_integration.py build/shiny . --native --capture settings.png
      - if: runner.os == 'Linux' && matrix.graphics == 'ON'
        run: xvfb-run -a python tests/test_profile.py build/shiny --native
      - if: runner.os == 'Linux' && matrix.graphics == 'ON'
        run: xvfb-run -a python tests/particle_materials.py build/shiny --output build/particle-pixels
      - if: runner.os == 'Windows' && matrix.graphics == 'ON'
        run: python tests/settings_integration.py build/Release/shiny.exe . --native --capture settings.png
      - if: runner.os == 'Windows' && matrix.graphics == 'ON'
        run: python tests/test_profile.py build/Release/shiny.exe --native
      - if: runner.os == 'Windows' && matrix.graphics == 'ON'
        run: python tests/particle_materials.py build/Release/shiny.exe --output build/particle-pixels
      - if: runner.os == 'macOS' && matrix.graphics == 'ON'
        run: python tests/settings_integration.py build/shiny . --native --capture settings.png
      - if: runner.os == 'macOS' && matrix.graphics == 'ON'
        run: python tests/test_profile.py build/shiny --native
      - if: runner.os == 'macOS' && matrix.graphics == 'ON'
        run: python tests/particle_materials.py build/shiny --output build/particle-pixels
  sanitizers:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - run: cmake -S . -B build -DSHINY_GRAPHICS=OFF -DSHINY_NETWORK=ON -DSHINY_STREAMING=ON -DSHINY_ADVANCED_RENDER=ON -DSHINY_DEVTOOLS=ON -DSHINY_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
