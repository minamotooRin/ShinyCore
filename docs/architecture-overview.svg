<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title description">
  <title id="title">ShinyCore 架构总览</title>
  <desc id="description">项目文件和离线工具交给应用宿主；应用管理跨房间服务和设备，并驱动一个活动房间。房间内的 Lua 玩法通过 sc.* 校验边界调用 C++ 原生世界。候选房间准备成功后才整体替换活动房间。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#5c708c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family:"Segoe UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif; }
    .title { fill:#172b45; font-size:29px; font-weight:700; }
    .subtitle { fill:#53657b; font-size:16px; }
    .heading { fill:#1d314b; font-size:19px; font-weight:700; }
    .name { fill:#20344f; font-size:18px; font-weight:700; }
    .body { fill:#344a63; font-size:15px; }
    .code { fill:#526780; font:15px Consolas,"Microsoft YaHei",monospace; }
    .small { fill:#526780; font-size:14px; }
    .line { fill:none; stroke:#5c708c; stroke-width:2; marker-end:url(#arrow); }
  </style>

  <rect width="1000" height="610" fill="#ffffff"/>
  <text class="title" x="32" y="42">ShinyCore 架构总览</text>
  <text class="subtitle" x="968" y="42" text-anchor="end">C++23 原生模拟 · Lua 编写玩法 · 路径相对仓库根目录</text>
  <line x1="32" y1="59" x2="968" y2="59" stroke="#dbe3ec"/>

  <!-- Authored input. -->
  <text class="small" x="32" y="80">项目内容与开发材料</text>
  <rect x="32" y="90" width="292" height="82" rx="9" fill="#f3f7fc" stroke="#d9e5f2"/>
  <rect x="336" y="90" width="292" height="82" rx="9" fill="#f3f7fc" stroke="#d9e5f2"/>
  <rect x="640" y="90" width="328" height="82" rx="9" fill="#f3f7fc" stroke="#d9e5f2"/>
  <text class="name" x="49" y="116">游戏项目</text>
  <text class="body" x="49" y="140">project.lua · 房间脚本 · 资源</text>
  <text class="code" x="49" y="161">examples/*/</text>
  <text class="name" x="353" y="116">可复用 Lua 模块</text>
  <text class="body" x="353" y="140">UI / 输入动作 / prefab 等</text>
  <text class="code" x="353" y="161">lua/shiny/ → lib/shiny/</text>
  <text class="name" x="657" y="116">离线工具与验证</text>
  <text class="body" x="657" y="140">脚手架、资源构建、回放检查</text>
  <text class="code" x="657" y="161">tools/ · tests/ · benchmarks/</text>
  <path class="line" d="M258 173 V197"/>

  <!-- Application owns services and one active room. -->
  <rect x="32" y="203" width="452" height="282" rx="11" fill="#f2f8f6" stroke="#cfe2da"/>
  <rect x="32" y="203" width="5" height="282" rx="2" fill="#388b70"/>
  <text class="heading" x="52" y="233">应用 App · 跨房间存活</text>
  <text class="code" x="464" y="233" text-anchor="end">src/runtime/main.cpp</text>
  <line x1="52" y1="248" x2="464" y2="248" stroke="#d4e5de"/>
  <text class="name" x="52" y="280">帧循环</text>
  <text class="body" x="145" y="279">输入快照 → 60 Hz 模拟 → 绘制</text>
  <text class="code" x="145" y="303">src/runtime/</text>
  <line x1="52" y1="319" x2="464" y2="319" stroke="#d4e5de"/>
  <text class="name" x="52" y="347">共享服务</text>
  <text class="body" x="145" y="346">加载资源与存档；保留音乐和会话</text>
  <text class="code" x="145" y="371">src/content/ · src/audio/ · src/net/</text>
  <line x1="52" y1="388" x2="464" y2="388" stroke="#d4e5de"/>
  <text class="name" x="52" y="419">设备后端</text>
  <text class="body" x="145" y="418">读取设备、提交图形与声音</text>
  <text class="code" x="145" y="443">src/platform/ · src/render/</text>

  <path class="line" d="M487 346 H516"/>
  <text class="small" x="501" y="333" text-anchor="middle">驱动</text>

  <!-- Room owns its VM and native world. -->
  <rect x="520" y="203" width="448" height="282" rx="11" fill="#f6f4fa" stroke="#ddd5eb"/>
  <rect x="520" y="203" width="5" height="282" rx="2" fill="#7b63a2"/>
  <text class="heading" x="540" y="233">房间 Room · 切换时整体替换</text>
  <line x1="540" y1="248" x2="948" y2="248" stroke="#e1dbec"/>

  <rect x="538" y="260" width="128" height="124" rx="8" fill="#ffffff" stroke="#e3dfec"/>
  <rect x="682" y="260" width="128" height="124" rx="8" fill="#ffffff" stroke="#e3dfec"/>
  <rect x="826" y="260" width="126" height="124" rx="8" fill="#ffffff" stroke="#e3dfec"/>
  <text class="name" x="551" y="286">Lua 玩法</text>
  <text class="body" x="551" y="314">update / draw</text>
  <text class="body" x="551" y="336">玩法规则 / UI</text>
  <text class="code" x="551" y="368">examples/*/</text>
  <path class="line" d="M668 321 H678"/>
  <text class="name" x="695" y="286">脚本接口</text>
  <text class="body" x="695" y="314">sc.* 参数检查</text>
  <text class="body" x="695" y="336">校验后转发</text>
  <text class="code" x="695" y="368">src/script/</text>
  <path class="line" d="M812 321 H822"/>
  <text class="name" x="839" y="286">固定模拟</text>
  <text class="body" x="839" y="312">实体 / Box2D</text>
  <text class="body" x="839" y="334">弹体 / 导航</text>
  <text class="code" x="839" y="357">src/core/</text>
  <text class="code" x="839" y="377">src/physics/</text>

  <rect x="538" y="402" width="414" height="65" rx="8" fill="#fff8ec" stroke="#ead8b9"/>
  <text class="name" x="551" y="429">候选房间</text>
  <text class="body" x="655" y="429">单独创建 Lua VM 与 World</text>
  <text class="body" x="655" y="452">资源和初次绘制成功后才替换</text>

  <!-- Design constraints and code map. -->
  <rect x="32" y="504" width="936" height="91" rx="9" fill="#f4f6f9" stroke="#dce4ed"/>
  <line x1="500" y1="517" x2="500" y2="582" stroke="#dce4ed"/>
  <text class="heading" x="50" y="534">设计边界</text>
  <text class="body" x="50" y="559">RAII 独占所有权 · 显式容量 · 无通用 ECS</text>
  <text class="body" x="50" y="582">固定顺序模拟；内核不依赖 Lua 和设备</text>
  <text class="heading" x="520" y="534">接口与裁剪</text>
  <text class="body" x="520" y="559">公共 C++ 接口：include/shiny/</text>
  <text class="body" x="520" y="582">图形 / 流式 / 高级渲染 / 网络 / 调试可关</text>
</svg>
