<svg xmlns="http://www.w3.org/2000/svg" width="960" height="752" viewBox="0 0 960 752" role="img" aria-labelledby="title description">
  <title id="title">ShinyCore 架构总览</title>
  <desc id="description">从可移植的 Lua 游戏项目，经应用宿主和房间生命周期，到脚本边界及 C++23 原生模拟。每个模块都标注仓库路径；候选房间只有准备成功才替换活动房间。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#b77925" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .title { fill:#12233d; font-size:27px; font-weight:700; }
    .subtitle { fill:#56667c; font-size:15px; font-weight:500; }
    .section { fill:#1d304a; font-size:18px; font-weight:700; }
    .node { fill:#1d304a; font-size:16px; font-weight:700; }
    .detail { fill:#41526a; font-size:14px; }
    .path { fill:#586b83; font:14px Consolas, "Microsoft YaHei", monospace; }
    .chip { fill:#34465f; font-size:14px; font-weight:600; }
    .icon { fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .flow { fill:none; stroke:#64748b; stroke-width:2; stroke-linecap:round; marker-end:url(#arrow); }
  </style>

  <rect width="960" height="752" fill="#ffffff"/>
  <text class="title" x="28" y="45">ShinyCore 架构总览</text>
  <text class="subtitle" x="932" y="43" text-anchor="end">C++23 原生内核 × Lua 编写游戏</text>
  <line x1="28" y1="65" x2="932" y2="65" stroke="#dbe3ec"/>

  <!-- Authored project: portable files and offline workflow. -->
  <rect x="28" y="82" width="904" height="116" rx="12" fill="#f3f7ff" stroke="#c9d9f2"/>
  <rect x="28" y="82" width="5" height="116" rx="2" fill="#4778be"/>
  <text class="section" x="52" y="112">01  编写 · 可移植的文本项目</text>
  <line x1="341" y1="129" x2="341" y2="184" stroke="#d9e4f3"/>
  <line x1="647" y1="129" x2="647" y2="184" stroke="#d9e4f3"/>
  <g class="icon" stroke="#4778be" transform="translate(54 139)">
    <path d="M2 0h13l5 5v19H2zM15 0v6h5M6 11h10M6 16h10"/>
  </g>
  <text class="node" x="85" y="153">游戏入口与房间脚本</text>
  <text class="path" x="85" y="178">project.lua · examples/</text>
  <g transform="translate(357 137)">
    <circle cx="13" cy="13" r="13" fill="#e0ebfb"/>
    <text x="13" y="18" text-anchor="middle" fill="#4778be" font-family="Consolas, monospace" font-size="14" font-weight="700">{ }</text>
  </g>
  <text class="node" x="389" y="153">可选 Lua 标准模块</text>
  <text class="path" x="389" y="178">lua/shiny/ → lib/shiny/</text>
  <g class="icon" stroke="#4778be" transform="translate(662 140)">
    <circle cx="6" cy="6" r="4"/><path d="M9 9l12 12M18 3l-5 5M16 1l6 6"/>
  </g>
  <text class="node" x="694" y="153">Agent 开发链</text>
  <text class="path" x="694" y="178">tools/ · tests/ · benchmarks/</text>

  <path class="flow" d="M480 199 V218"/>

  <!-- Application-owned services and device adapters. -->
  <rect x="28" y="224" width="904" height="168" rx="12" fill="#f1faf6" stroke="#c7e6d8"/>
  <rect x="28" y="224" width="5" height="168" rx="2" fill="#3e9878"/>
  <text class="section" x="52" y="254">02  应用 · 跨房间存活</text>
  <text class="path" x="908" y="253" text-anchor="end">src/runtime/main.cpp</text>
  <rect x="52" y="270" width="274" height="104" rx="8" fill="#ffffff" stroke="#d8e9e0"/>
  <rect x="343" y="270" width="296" height="104" rx="8" fill="#ffffff" stroke="#d8e9e0"/>
  <rect x="656" y="270" width="252" height="104" rx="8" fill="#ffffff" stroke="#d8e9e0"/>
  <g class="icon" stroke="#3e9878" transform="translate(69 289)">
    <circle cx="11" cy="11" r="9"/><path d="M11 6v5l4 3"/>
  </g>
  <text class="node" x="100" y="308">主循环</text>
  <text class="path" x="69" y="335">src/runtime/</text>
  <text class="detail" x="69" y="358">输入快照 → 固定更新 → 绘制</text>
  <g class="icon" stroke="#3e9878" transform="translate(359 291)">
    <ellipse cx="11" cy="4" rx="10" ry="4"/><path d="M1 4v15c0 5 20 5 20 0V4M1 12c0 5 20 5 20 0"/>
  </g>
  <text class="node" x="390" y="308">共享服务</text>
  <text class="path" x="359" y="335">src/content/ · src/audio/ · src/net/</text>
  <text class="detail" x="359" y="358">资源 / 存档 / 设置 / 音乐 / 会话</text>
  <g class="icon" stroke="#3e9878" transform="translate(674 288)">
    <rect x="1" y="2" width="22" height="16" rx="2"/><path d="M7 22h10M12 18v4"/>
  </g>
  <text class="node" x="706" y="308">设备后端</text>
  <text class="path" x="673" y="335">src/platform/ · src/render/</text>
  <text class="detail" x="673" y="358">图形可关；无窗口同一模拟</text>

  <path class="flow" d="M480 393 V412"/>

  <!-- Room commit is the only lateral flow. -->
  <rect x="28" y="418" width="904" height="126" rx="12" fill="#fff8ee" stroke="#efd8b8"/>
  <rect x="28" y="418" width="5" height="126" rx="2" fill="#bd822e"/>
  <text class="section" x="52" y="448">03  房间 · 切换时整体替换</text>
  <rect x="52" y="465" width="478" height="60" rx="8" fill="#ffffff" stroke="#eedfc8"/>
  <rect x="620" y="465" width="288" height="60" rx="8" fill="#ffffff" stroke="#eedfc8"/>
  <g class="icon" stroke="#bd822e" transform="translate(68 481)">
    <path d="M1 10L12 1l11 9M4 8v15h16V8M9 23v-9h6v9"/>
  </g>
  <text class="node" x="103" y="490">活动房间：独立 Lua VM + World</text>
  <text class="detail" x="103" y="513">玩法、UI、实体和临时状态归房间所有</text>
  <g class="icon" stroke="#bd822e" transform="translate(636 481)">
    <path d="M3 1h20M3 23h20M6 2c0 8 14 8 14 10S6 14 6 22M20 2c0 8-14 8-14 10s14 2 14 10"/>
  </g>
  <text class="node" x="671" y="490">候选房间</text>
  <text class="detail" x="671" y="513">资源、初始化、初绘成功才替换</text>
  <path d="M609 495 H544" fill="none" stroke="#b77925" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-amber)"/>

  <path class="flow" d="M290 545 V564"/>

  <!-- Validated Lua boundary and device-independent simulation. -->
  <rect x="28" y="570" width="904" height="110" rx="12" fill="#f6f3fc" stroke="#dcd1ef"/>
  <rect x="28" y="570" width="5" height="110" rx="2" fill="#8260b1"/>
  <text class="section" x="52" y="600">04  原生调用 · sc.* 边界 → 60 Hz 确定顺序模拟</text>
  <text class="path" x="908" y="599" text-anchor="end">include/shiny/</text>
  <rect x="52" y="614" width="330" height="49" rx="8" fill="#ffffff" stroke="#e4dcec"/>
  <rect x="440" y="614" width="468" height="49" rx="8" fill="#ffffff" stroke="#e4dcec"/>
  <g class="icon" stroke="#8260b1" transform="translate(68 626)">
    <path d="M12 0L2 4v9c0 7 10 11 10 11s10-4 10-11V4zM7 12l3 3 6-7"/>
  </g>
  <text class="node" x="102" y="636">参数与阶段校验</text>
  <text class="path" x="102" y="654">src/script/</text>
  <path class="flow" d="M392 639 H426"/>
  <g class="icon" stroke="#8260b1" transform="translate(457 625)">
    <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 0v3M12 21v3M0 12h3M21 12h3"/>
  </g>
  <text class="node" x="490" y="636">实体 / 物理 / 弹体 / 导航</text>
  <text class="path" x="490" y="654">src/core/ · src/physics/ · Box2D</text>

  <rect x="28" y="697" width="904" height="40" rx="8" fill="#f7f9fc" stroke="#dce4ec"/>
  <text class="chip" x="52" y="723">设计约束</text>
  <circle cx="157" cy="717" r="3" fill="#4778be"/>
  <text class="chip" x="169" y="723">RAII · 独占所有权 · 无通用 ECS</text>
  <circle cx="431" cy="717" r="3" fill="#3e9878"/>
  <text class="chip" x="443" y="723">显式容量 · 内核与设备隔离</text>
  <circle cx="681" cy="717" r="3" fill="#8260b1"/>
  <text class="chip" x="693" y="723">流式 / 高级渲染 / 联机 / 调试可关</text>
</svg>
